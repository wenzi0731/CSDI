data:
  history: 96
  horizon: 24
  stride: 24
  train_fraction: 0.6
  val_fraction: 0.2
dlinear:
  kernel: 25
  individual: true
train:
  batch_size: 16
  dlinear_epochs: 50
  diffusion_epochs: 100
  lr: 0.001
  grad_clip: 1.0
diffusion:
  layers: 4
  channels: 64
  nheads: 8
  diffusion_embedding_dim: 128
  beta_min: 0.1
  beta_max: 20.0
  schedule: vp_continuous
  is_linear: false
model:
  is_unconditional: false
  timeemb: 128
  featureemb: 16
  target_strategy: test
evaluation:
  samples: 100
  batch_size: 4
  near_optimal_tolerance: 0.02
study:
  diffusion_steps: [10, 20, 50, 100, 200]
  relative_loss_epsilon: 1.0e-8
