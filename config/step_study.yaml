data:
  task: daily_exogenous
  seq_len: 24
  weather_feature_set: pv10
  train_years: [2014, 2015, 2016, 2017, 2018, 2019, 2020]
  val_years: [2021]
  test_years: [2022]
  residual_normalization: train_residual
dlinear:
  kernel: 5
  individual: true
  pv_year_film_scale: 0.20
train:
  batch_size: 16
  dlinear_epochs: 50
  diffusion_epochs: 100
  lr: 0.001
  grad_clip: 1.0
diffusion:
  layers: 4
  channels: 64
  nheads: 8
  diffusion_embedding_dim: 128
  beta_min: 0.1
  beta_max: 20.0
  schedule: vp_continuous
  is_linear: false
model:
  condition_on_skeleton: true
  pv_year_film_scale: 0.20
  is_unconditional: false
  timeemb: 128
  featureemb: 16
  target_strategy: test
evaluation:
  samples: 100
  batch_size: 4
  near_optimal_tolerance: 0.02
study:
  diffusion_steps: [10, 20, 50, 100, 200]
  relative_loss_epsilon: 1.0e-8
